name: Release Type Definitions Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 9.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode (skip actual publishing)'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

permissions:
  contents: write
  pull-requests: read

jobs:
  release-types:
    name: Release @rdkcentral/firebolt-js-types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc)?$ ]]; then
            echo "Error: Version must be in format X.Y.Z or X.Y.Z-rc (e.g., 9.0.0 or 9.0.0-rc)"
            exit 1
          fi
          echo "Version format is valid: $VERSION"

      - name: Check if version already exists
        run: |
          VERSION="${{ inputs.version }}"
          TAG_NAME="v${VERSION}"
          
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Error: Version $VERSION already exists as tag $TAG_NAME"
            echo "Please use a different version number"
            exit 1
          fi
          
          echo "Version $VERSION is available for release"

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Generate type definitions
        run: |
          cd package
          npm run generate

      - name: Test type definitions
        run: |
          cd references/firebolt-type-reference-app
          npm install
          npm run build

      - name: Update package version
        run: |
          VERSION="${{ inputs.version }}"
          cd package
          npm version "$VERSION" --no-git-tag-version

      - name: Generate release notes
        run: node scripts/generate-release-notes.cjs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}

      - name: Create git tag
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          VERSION="${{ inputs.version }}"
          TAG_NAME="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release @rdkcentral/firebolt-js-types@$VERSION"
          git push origin "$TAG_NAME"

      - name: Publish to GitHub npm registry
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          cd package
          if [[ "${{ inputs.version }}" == *"-rc"* ]]; then
            npm publish --tag rc
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FIREBOLT_WEB_PUB }}

      - name: Test npm publish (dry-run)
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          cd package
          if [[ "${{ inputs.version }}" == *"-rc"* ]]; then
            npm publish --tag rc --dry-run
          else
            npm publish --dry-run
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.FIREBOLT_WEB_PUB }}

      - name: Test type definitions (dry-run)
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          cd references/firebolt-type-reference-app
          npm install
          npm run build

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77
        with:
          tag_name: v${{ inputs.version }}
          name: "@rdkcentral/firebolt-js-types@${{ inputs.version }}"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(inputs.version, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.FIREBOLT_WEB_PUB }}

      - name: Create test GitHub Release (dry-run)
        if: ${{ inputs.dry_run == 'true' }}
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77
        with:
          tag_name: test-v${{ inputs.version }}
          name: "DRY-RUN: @rdkcentral/firebolt-js-types@${{ inputs.version }}"
          body_path: release-notes.md
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
