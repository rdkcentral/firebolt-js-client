name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install npm dependencies
        run: |
          npm ci

      - name: Generate type definitions
        run: |
          npm run generate

      - name: Check generated WebKit builder freshness
        run: |
          git diff --exit-code -- webkitExtension/resources/firebolt-builder.js

      - name: Build
        run: |
          npm run build

      - name: Test generator and builder parity
        run: |
          npm test
