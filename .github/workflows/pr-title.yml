name: Validate PR Title

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint pull request title
        run: |
          title="$(jq -r '.pull_request.title // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$title" ]; then
            echo "::error::Pull request title is missing from the event payload."
            exit 1
          fi

          title_file="$RUNNER_TEMP/pr-title.txt"
          printf '%s\n' "$title" > "$title_file"
          npm exec -- commitlint --edit "$title_file"